version: 2.1

orbs:
  python: circleci/python@2.1.1
  node: circleci/node@5.2.0
  aws-ecr: circleci/aws-ecr@9.3.4
  kubernetes: circleci/kubernetes@1.3.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
  node-executor:
    docker:
      - image: cimg/node:22.12
    resource_class: small

jobs:
  backend-test:
    executor: python-executor
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: pip
          app-dir: backend
          pip-dependency-file: requirements.txt
      - run:
          name: Run backend tests
          command: |
            cd backend
            python -m pytest tests/ -v --tb=short
          environment:
            USE_MOCK_LLM: "true"
            DATABASE_URL: "sqlite+aiosqlite:///./test.db"

  backend-lint:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Install linters
          command: pip install ruff mypy
      - run:
          name: Lint
          command: |
            cd backend
            ruff check app/

  frontend-build:
    executor: node-executor
    steps:
      - checkout
      - node/install-packages:
          app-dir: frontend
          pkg-manager: npm
      - run:
          name: Type check
          command: cd frontend && npm run build

  build-and-push-backend:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - aws-ecr/build_and_push_image:
          repo: earnings-rag-backend
          tag: ${CIRCLE_SHA1},latest
          dockerfile: backend/Dockerfile
          path: backend/
          account_id: ${AWS_ACCOUNT_ID}
          region: ${AWS_DEFAULT_REGION}

  build-and-push-frontend:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - aws-ecr/build_and_push_image:
          repo: earnings-rag-frontend
          tag: ${CIRCLE_SHA1},latest
          dockerfile: frontend/Dockerfile
          path: frontend/
          account_id: ${AWS_ACCOUNT_ID}
          region: ${AWS_DEFAULT_REGION}

  deploy:
    executor: python-executor
    steps:
      - checkout
      - kubernetes/install-kubectl
      - run:
          name: Configure kubectl
          command: |
            aws eks update-kubeconfig \
              --region ${AWS_DEFAULT_REGION} \
              --name ${EKS_CLUSTER_NAME}
      - run:
          name: Deploy to Kubernetes
          command: |
            kubectl apply -f k8s/namespace.yaml
            kubectl apply -f k8s/configmap.yaml
            kubectl apply -f k8s/backend-deployment.yaml
            kubectl apply -f k8s/services.yaml
            kubectl apply -f k8s/ingress.yaml
            kubectl set image deployment/earnings-rag-backend \
              backend=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/earnings-rag-backend:${CIRCLE_SHA1} \
              -n earnings-rag
            kubectl set image deployment/earnings-rag-frontend \
              frontend=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/earnings-rag-frontend:${CIRCLE_SHA1} \
              -n earnings-rag
            kubectl rollout status deployment/earnings-rag-backend -n earnings-rag --timeout=120s
            kubectl rollout status deployment/earnings-rag-frontend -n earnings-rag --timeout=60s

workflows:
  ci-cd:
    jobs:
      - backend-test
      - backend-lint
      - frontend-build
      - build-and-push-backend:
          requires:
            - backend-test
            - backend-lint
          filters:
            branches:
              only: main
      - build-and-push-frontend:
          requires:
            - frontend-build
          filters:
            branches:
              only: main
      - deploy:
          requires:
            - build-and-push-backend
            - build-and-push-frontend
          filters:
            branches:
              only: main
