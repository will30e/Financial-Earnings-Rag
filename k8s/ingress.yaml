apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: earnings-rag-ingress
  namespace: earnings-rag
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: earnings-rag.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: earnings-rag-backend
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: earnings-rag-backend
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: earnings-rag-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: earnings-rag-frontend
                port:
                  number: 80
